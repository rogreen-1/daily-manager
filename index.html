<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav">
    <a class="navlink active-nav" href="./index.html">Tasks</a>
    <a class="navlink" href="./calendar.html">Calendar</a>
  </nav>
  <main class="page">
    <section class="card">
      <header class="header">
        <div>
          <h1>Task Manager</h1>
        </div>
        <div class="stats" aria-label="completion">
          <div class="pill" id="pct">0%</div>
          <div class="meta" id="meta">0/0 done</div>
        </div>
      </header>
      <form id="task-form" class="add" autocomplete="off">
  <input id="task-input" class="input" placeholder="Add a task…" />
  <select id="task-rank" class="select" title="Importance">
    <option value="" selected disabled>Priority</option>
    <option value="3">High</option>
    <option value="2">Medium</option>
    <option value="1">Low</option>
  </select>
  <input id="task-deadline" class="date" type="date" title="Deadline" />
  <select id="task-repeat" class="select" title="Repeat">
    <option value="" selected>No repeat</option>
    <option value="daily">Daily</option>
    <option value="weekly">Weekly</option>
    <option value="monthly">Monthly</option>
   </select>
      <button class="btn" type="submit">Add</button>
      </form>
      <ul id="task-list" class="list"></ul>
      <ul id="task-list" class="list"></ul>
<div class="missed-wrapper" id="missed-wrapper" style="display:none">
  <button id="missed-toggle" class="missed-toggle">⚠ Missed (0) ▼</button>
  <div id="missed-section" class="missed-section">
    <ul id="missed-list" class="list"></ul>
  </div>
</div>
<div class="done-wrapper">
  <button id="done-toggle" class="done-toggle">Completed (0) ▼</button>
  <div id="done-section" class="done-section">
    <ul id="done-list" class="list"></ul>
  </div>
</div>
      <div class="done-wrapper">
        <button id="done-toggle" class="done-toggle">Completed (0) ▼</button>
        <div id="done-section" class="done-section">
          <ul id="done-list" class="list"></ul>
        </div>
      </div>
      <footer class="footer">
  <button id="clear" class="link">Clear all tasks</button>
  <span class="dot">•</span>
  <button id="export-ics" class="link">Export to .ics</button>
  <span class="dot">•</span>
  <span class="hint">Saved automatically</span>
</footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
