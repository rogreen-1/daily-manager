<div class="container">
  <header class="header">
    <div>
      <h1>Daily Focus</h1>
      <p class="sub" id="date"></p>
    </div>
    <div class="stats">
      <div class="pill" id="pct">0%</div>
      <div class="meta" id="meta">0/0 done</div>
    </div>
  </header>

  <form id="task-form" class="add">
    <input id="task-input" class="input" placeholder="Add a task…" autocomplete="off" />
    <button class="btn" type="submit">Add</button>
  </form>

  <ul id="task-list" class="list"></ul>

  <footer class="footer">
    <button id="clear" class="link">Clear</button>
    <span class="dot">•</span>
    <span class="hint">Saved automatically</span>
  </footer>
</div>

<script>
  document.getElementById("date").textContent =
    new Date().toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
</script>
